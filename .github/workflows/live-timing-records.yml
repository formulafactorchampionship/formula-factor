name: Live timing records

# The public site is served by GitHub Pages, which is static and cannot run the
# always-on relay, so the stored lap times it shows come from
# live_timing_records.json. This job keeps that file fresh: it folds in the
# panel's current "Stored Times" and every session archived since the last run,
# then commits only what actually changed.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-timing-records
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh stored lap times
        run: node server/build-live-timing-records.mjs --timeout 25000

      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_timing_records.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore(live-timing): refresh stored times"
            git push
          fi
